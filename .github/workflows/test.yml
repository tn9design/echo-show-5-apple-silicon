name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without devices
        run: swift test
      - name: CLI and MCP protocol smoke
        run: python3 script/test-ai-interfaces.py "$(swift build --show-bin-path)"
      - name: Translation configuration checks without a guest
        run: python3 tools/test-linux-translation.py
      - name: Translation supervision checks without a guest
        run: python3 tools/test-translation-attempt.py
      - name: Bounded unlock metadata checks without a device
        run: python3 tools/test-bounded-unlock.py
      - name: Source packaging
        run: bash script/package-release.sh /tmp/EchoGuide-release
      - name: Validate source archive
        run: python3 script/test-source-package.py /tmp/EchoGuide-release/EchoGuide-source-preview.zip
